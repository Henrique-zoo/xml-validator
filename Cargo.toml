[package]
name = "xml_transformer"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[features]
# Requer os arquivos e testes privados mantidos somente na máquina local.
local-tests = []

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_repr = "0.1"
stdbr = "0.3"
